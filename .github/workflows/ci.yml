name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint
          - name: Prettier
            run: npm run format:check
          - name: Typecheck
            run: npm run typecheck
          - name: Test
            run: npm test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      # Install scripts only download ffmpeg-static's binary, which no check needs.
      - run: npm ci --ignore-scripts
      - run: ${{ matrix.run }}
