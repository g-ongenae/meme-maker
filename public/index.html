<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme templates</title>
<link rel="icon" href="/icon.svg">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f5f3;
  --surface: #ffffff;
  --tile: #eceae6;
  --text: #1c1b1a;
  --muted: #6f6b66;
  --border: #dedbd5;
  --accent: #e11d48;
  --accent-text: #be123c;
  --stage: #1a1918;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131211;
    --surface: #1d1c1a;
    --tile: #262422;
    --text: #efedea;
    --muted: #9c9790;
    --border: #33302d;
    --accent-text: #fb7185;
    --stage: #0c0b0b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
body:has(dialog[open]) { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 12px 20px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand img { width: 28px; height: 28px; }
h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
#count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.controls { display: flex; gap: 8px; flex: 1 1 320px; max-width: 520px; }
#search, #sort {
  height: 36px;
  padding: 0 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
#search { flex: 1; min-width: 0; }

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 14px;
  padding: 20px;
  margin: 0;
  list-style: none;
}
.card {
  display: block;
  height: 100%;
  color: inherit;
  text-decoration: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  content-visibility: auto;
  contain-intrinsic-size: auto 230px;
  transition: border-color 0.12s, transform 0.12s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: contain;
  background: var(--tile);
}
.card .name, .card .aka {
  display: block;
  padding: 0 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card .name { padding-top: 8px; font-size: 13.5px; font-weight: 550; }
.card .name:last-child { padding-bottom: 9px; }
.card .aka { padding-bottom: 9px; font-size: 12px; color: var(--muted); }
#empty { padding: 64px 20px; text-align: center; color: var(--muted); }
#empty code { color: var(--text); }
[hidden] { display: none !important; }

dialog {
  width: min(1100px, 96vw);
  height: min(900px, 94dvh);
  max-width: none;
  max-height: none;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  overflow: hidden;
}
dialog[open] { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
dialog::backdrop { background: rgb(0 0 0 / 0.7); }
.stage {
  position: relative;
  display: grid;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
  background: var(--stage);
}
#big { place-self: center; width: 100%; height: 100%; object-fit: contain; }
.stage button {
  position: absolute;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgb(0 0 0 / 0.55);
  color: #fff;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.stage button:hover { background: var(--accent); }
#close { top: 12px; right: 12px; }
#prev, #next { top: 50%; translate: 0 -50%; }
#prev { left: 12px; }
#next { right: 12px; }
.info {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  padding: 14px 18px;
  border-top: 1px solid var(--border);
}
.info > div:first-child { flex: 1 1 260px; min-width: 0; }
.info h2 { margin: 0; font-size: 17px; font-weight: 650; overflow-wrap: anywhere; }
.info p { margin: 2px 0 0; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: inherit;
  font-size: 13.5px;
  text-decoration: none;
  white-space: nowrap;
}
.actions a:hover { border-color: var(--accent); color: var(--accent-text); }
@media (max-width: 560px) {
  header { padding: 10px 14px; }
  #grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 14px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/icon.svg" alt="">
    <h1>Meme templates</h1>
    <span id="count"></span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search by name or alias…  ( / )" autocomplete="off" spellcheck="false" aria-label="Search templates">
    <select id="sort" aria-label="Sort order">
      <option value="rank">Most popular</option>
      <option value="name">Name A–Z</option>
      <option value="size">Largest</option>
    </select>
  </div>
</header>

<main>
  <ul id="grid"></ul>
  <p id="empty" hidden></p>
</main>

<dialog id="viewer" aria-labelledby="title">
  <div class="stage">
    <img id="big" alt="">
    <button id="close" type="button" aria-label="Close">✕</button>
    <button id="prev" type="button" aria-label="Previous template">‹</button>
    <button id="next" type="button" aria-label="Next template">›</button>
  </div>
  <div class="info">
    <div>
      <h2 id="title"></h2>
      <p id="meta"></p>
      <p id="aliases"></p>
    </div>
    <div class="actions">
      <a id="open" target="_blank" rel="noopener">Open original</a>
      <a id="download">Download</a>
      <a id="source" target="_blank" rel="noopener">View on imgflip</a>
    </div>
  </div>
</dialog>

<script type="module">
const $ = (id) => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), count = $('count');
const search = $('search'), sort = $('sort'), viewer = $('viewer'), big = $('big');

const fold = (s) => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
const imgUrl = (t) => `/img/${encodeURIComponent(t.file)}`;
const thumbUrl = (t) => `/thumb/${encodeURIComponent(t.file)}`;
const fmt = new Intl.NumberFormat('en');

const SORTS = {
  rank: (a, b) => a.rank - b.rank,
  name: (a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }),
  size: (a, b) => b.width * b.height - a.width * a.height || a.rank - b.rank,
};

let templates = [];
let visible = [];   // templates currently shown, in display order
let current = null; // template open in the viewer

function buildCard(t) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.className = 'card';
  a.href = `#${t.id}`;
  a.title = t.name;

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.decoding = 'async';
  img.alt = '';
  img.src = thumbUrl(t);

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = t.name;

  const aka = document.createElement('span');
  aka.className = 'aka';
  aka.hidden = true;

  a.append(img, name, aka);
  li.append(a);
  t.el = li;
  t.akaEl = aka;
  t.nameKey = fold(t.name);
  t.aliasKeys = t.aliases.map(fold);
}

function render() {
  const words = fold(search.value).split(/\s+/).filter(Boolean);
  const ordered = [...templates].sort(SORTS[sort.value]);
  visible = [];

  for (const t of ordered) {
    const inName = words.every((w) => t.nameKey.includes(w));
    const alias = inName ? -1 : t.aliasKeys.findIndex((k) => words.every((w) => k.includes(w)));
    const show = inName || alias > -1;
    t.el.hidden = !show;
    t.akaEl.hidden = alias < 0;
    if (alias > -1) t.akaEl.textContent = `aka ${t.aliases[alias]}`;
    if (show) visible.push(t);
  }
  grid.replaceChildren(...ordered.map((t) => t.el));

  count.textContent = visible.length === templates.length
    ? `${fmt.format(templates.length)} templates`
    : `${fmt.format(visible.length)} of ${fmt.format(templates.length)}`;
  empty.hidden = visible.length > 0;
  if (!visible.length) empty.textContent = `No template matches “${search.value.trim()}”.`;

  const url = new URL(location.href);
  if (search.value.trim()) url.searchParams.set('q', search.value.trim());
  else url.searchParams.delete('q');
  if (sort.value === 'rank') url.searchParams.delete('sort');
  else url.searchParams.set('sort', sort.value);
  history.replaceState(null, '', url);
}

function setHash(id) {
  history.replaceState(null, '', location.pathname + location.search + (id ? `#${id}` : ''));
}

function show(t) {
  current = t;
  // Show the cached thumbnail straight away, then swap in the original.
  big.src = thumbUrl(t);
  big.alt = t.name;
  big.style.maxWidth = `${t.width}px`;
  big.style.maxHeight = `${t.height}px`;
  const full = new Image();
  full.onload = () => { if (current === t) big.src = full.src; };
  full.src = imgUrl(t);

  $('title').textContent = t.name;
  $('meta').textContent =
    `#${t.rank} on ${t.source.site} · ${t.width} × ${t.height} · ${t.file.split('.').pop().toUpperCase()}`;
  $('aliases').textContent = t.aliases.length ? `Also known as: ${t.aliases.join(', ')}` : '';
  $('aliases').hidden = !t.aliases.length;
  $('open').href = imgUrl(t);
  $('download').href = imgUrl(t);
  $('download').download = t.file;
  $('source').href = t.source.pageUrl;

  const many = visible.length > 1 && visible.includes(t);
  $('prev').hidden = $('next').hidden = !many;

  setHash(t.id);
  if (!viewer.open) viewer.showModal();
}

function step(delta) {
  const i = visible.indexOf(current);
  if (i < 0 || visible.length < 2) return;
  show(visible[(i + delta + visible.length) % visible.length]);
}

function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const t = id && templates.find((x) => x.id === id);
  if (t) show(t);
  else if (viewer.open) viewer.close();
}

grid.addEventListener('click', (e) => {
  const card = e.target.closest('.card');
  if (!card || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  const t = templates.find((x) => x.el === card.parentElement);
  if (t) show(t);
});
$('close').addEventListener('click', () => viewer.close());
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });
viewer.addEventListener('close', () => { current = null; big.removeAttribute('src'); setHash(''); });
viewer.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});
window.addEventListener('hashchange', openFromHash);
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== search && !viewer.open) {
    e.preventDefault();
    search.select();
  }
});
search.addEventListener('input', render);
sort.addEventListener('change', render);

async function init() {
  const res = await fetch('/api/templates');
  if (!res.ok) {
    empty.hidden = false;
    empty.innerHTML = 'No templates found. Run <code>npm run fetch:imgflip</code> then <code>npm run dedupe</code>, and reload.';
    return;
  }
  templates = await res.json();
  templates.forEach(buildCard);

  const params = new URLSearchParams(location.search);
  search.value = params.get('q') ?? '';
  if (params.get('sort') in SORTS) sort.value = params.get('sort');
  const hash = location.hash;
  render();
  if (hash) { history.replaceState(null, '', location.pathname + location.search + hash); openFromHash(); }
}

init().catch((err) => {
  empty.hidden = false;
  empty.textContent = `Could not load templates: ${err.message}`;
});
</script>
</body>
</html>
