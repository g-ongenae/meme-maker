<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meme templates</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/icon.svg" alt="" />
        <h1>Meme templates</h1>
        <span id="count"></span>
      </div>
      <div class="controls">
        <input
          id="search"
          type="search"
          placeholder="Search by name or alias…  ( / )"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search templates"
        />
        <select id="category" aria-label="Category">
          <option value="">All templates</option>
        </select>
        <select id="sort" aria-label="Sort order">
          <option value="rank">Most popular</option>
          <option value="name">Name A–Z</option>
          <option value="size">Largest</option>
        </select>
      </div>
    </header>

    <main>
      <ul id="grid"></ul>
      <p id="empty" hidden></p>
    </main>

    <dialog id="viewer" aria-labelledby="title">
      <div class="stage">
        <img id="big" alt="" />
        <video id="bigVideo" muted loop playsinline disableremoteplayback hidden></video>
        <button id="close" type="button" aria-label="Close">✕</button>
        <button id="prev" type="button" aria-label="Previous template">‹</button>
        <button id="next" type="button" aria-label="Next template">›</button>
      </div>
      <aside id="related" aria-labelledby="relatedTitle" hidden>
        <div class="related-head">
          <h3 id="relatedTitle">Alternatives</h3>
          <button
            id="relatedClose"
            type="button"
            aria-label="Hide alternatives"
            title="Hide alternatives (A)"
          >
            ✕
          </button>
        </div>
        <label class="switch"><input id="showDuplicates" type="checkbox" /> Show duplicates</label>
        <section id="formats">
          <h4>Formats</h4>
          <ul id="formatList"></ul>
        </section>
        <section id="variations">
          <h4>Variations</h4>
          <ul id="variationList"></ul>
        </section>
        <p id="relatedEmpty">Only duplicates here: turn on “Show duplicates” to see them.</p>
      </aside>
      <div class="info">
        <div>
          <h2 id="title"></h2>
          <p id="meta"></p>
          <p id="aliases"></p>
        </div>
        <div class="actions">
          <button
            id="relatedToggle"
            type="button"
            aria-controls="related"
            aria-expanded="false"
            title="Show or hide alternatives (A)"
          >
            Alternatives <span id="relatedCount"></span>
          </button>
          <a id="open" target="_blank" rel="noopener">Open original</a>
          <a id="download">Download</a>
          <a id="source" target="_blank" rel="noopener">View on imgflip</a>
        </div>
      </div>
    </dialog>
  </body>
</html>
